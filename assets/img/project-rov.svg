<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c43" />
      <stop offset="100%" stop-color="#051923" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#oceanBg)" />
  
  <!-- Subtle Wave Lines -->
  <path d="M 0 100 Q 200 80 400 100 T 800 100" fill="none" stroke="#006494" stroke-width="1.5" opacity="0.3" />
  <path d="M 0 200 Q 200 180 400 200 T 800 200" fill="none" stroke="#006494" stroke-width="1.5" opacity="0.2" />
  <path d="M 0 450 Q 200 430 400 450 T 800 450" fill="none" stroke="#006494" stroke-width="1.5" opacity="0.2" />

  <!-- Award Badge -->
  <rect x="50" y="45" width="310" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
  <text x="75" y="67" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">★ 2ND HONORABLE MENTION • NASIONAL</text>

  <!-- ROV Submersible Illustration -->
  <g transform="translate(100, 160)">
    <!-- ROV Body Frame -->
    <rect x="50" y="50" width="220" height="130" rx="25" fill="#132a40" stroke="#00a6fb" stroke-width="3" />
    
    <!-- Thrusters -->
    <rect x="25" y="35" width="35" height="30" rx="6" fill="#051923" stroke="#00a6fb" stroke-width="2" />
    <rect x="25" y="165" width="35" height="30" rx="6" fill="#051923" stroke="#00a6fb" stroke-width="2" />
    <rect x="260" y="100" width="35" height="30" rx="6" fill="#051923" stroke="#00a6fb" stroke-width="2" />
    
    <!-- Acrylic Dome / Camera -->
    <path d="M 270 75 Q 315 115 270 155" fill="#006494" stroke="#00a6fb" stroke-width="2.5" />
    <circle cx="270" cy="115" r="14" fill="#051923" stroke="#38bdf8" stroke-width="2" />
    <circle cx="270" cy="115" r="6" fill="#38bdf8" />

    <!-- Headlight Cone -->
    <polygon points="285,100 480,40 480,190 285,130" fill="url(#goldGrad)" opacity="0.12" />

    <text x="160" y="122" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700">MARINE SAVIOR</text>
    <text x="160" y="142" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">ROV UNIT 01</text>
  </g>

  <!-- AI YOLOv8 Detection Box Target -->
  <g transform="translate(510, 180)">
    <rect x="0" y="0" width="210" height="190" rx="8" fill="rgba(19, 42, 64, 0.4)" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4" />
    
    <!-- Bounding Box Header -->
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#10b981" />
    <text x="8" y="16" fill="#051923" font-family="monospace" font-size="11" font-weight="800">PLASTIC DEBRIS 94.6%</text>

    <!-- Plastic Bottle Shape -->
    <path d="M 95 50 L 115 50 L 115 65 L 125 75 L 125 150 L 85 150 L 85 75 L 95 65 Z" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
    <line x1="85" y1="100" x2="125" y2="100" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="85" y1="120" x2="125" y2="120" stroke="#94a3b8" stroke-width="1.5" />

    <text x="105" y="175" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">YOLOv8 DETECTED</text>
  </g>

  <!-- Bottom Accent / Specs -->
  <text x="400" y="530" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    Nusantara Writing Festival III • National Scientific Paper • 2025
  </text>
  <text x="400" y="555" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">
    Undersea ROV Hardware • Embedded YOLOv8 Inference • Ocean Waste Preservation
  </text>
</svg>
