<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cadBg)" />
  <rect width="800" height="500" fill="url(#cadGrid)" />

  <!-- Technical Blueprint Title Badge -->
  <rect x="40" y="32" width="310" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" />
  <circle cx="56" cy="47" r="4" fill="#38bdf8" />
  <text x="70" y="52" fill="#38bdf8" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">AUTOCAD 2D • RESIDENTIAL 3 FLOORS</text>

  <!-- Architectural House Floorplan Wireframe -->
  <g transform="translate(60, 95)" stroke="#38bdf8" stroke-width="1.8" fill="none">
    <!-- Outer Walls (3-Storey Blueprint Isometric/Orthogonal Stack) -->
    <!-- Floor 1 -->
    <rect x="0" y="30" width="280" height="230" rx="4" stroke="#0ea5e9" stroke-width="2" fill="rgba(14, 165, 233, 0.04)" />
    <!-- Rooms Partition -->
    <line x1="120" y1="30" x2="120" y2="260" stroke="#0284c7" stroke-dasharray="4,3" />
    <line x1="0" y1="140" x2="120" y2="140" stroke="#0284c7" />
    <line x1="120" y1="170" x2="280" y2="170" stroke="#0284c7" />
    
    <!-- Room Labels -->
    <text x="60" y="85" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" stroke="none">LIVING ROOM</text>
    <text x="60" y="200" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" stroke="none">CARPORT / GARDEN</text>
    <text x="200" y="100" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" stroke="none">BEDROOM 1</text>
    <text x="200" y="220" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" stroke="none">DINING &amp; KITCHEN</text>

    <!-- Electrical Installation Symbols: Downlights -->
    <g fill="#f59e0b" stroke="#f59e0b" stroke-width="1.2">
      <!-- Lighting Symbol 1 -->
      <circle cx="60" cy="105" r="7" fill="none" />
      <line x1="53" y1="98" x2="67" y2="112" />
      <line x1="67" y1="98" x2="53" y2="112" />

      <!-- Lighting Symbol 2 -->
      <circle cx="200" cy="65" r="7" fill="none" />
      <line x1="193" y1="58" x2="207" y2="72" />
      <line x1="207" y1="58" x2="193" y2="72" />

      <!-- Lighting Symbol 3 -->
      <circle cx="200" cy="140" r="7" fill="none" />
      <line x1="193" y1="133" x2="207" y2="147" />
      <line x1="207" y1="133" x2="193" y2="147" />
    </g>

    <!-- Conduit Wiring Arc Paths (AutoCAD Electrical Style) -->
    <path d="M 60 105 Q 130 90 200 65" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5,4" fill="none" opacity="0.85" />
    <path d="M 200 65 Q 230 100 200 140" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5,4" fill="none" opacity="0.85" />
    <path d="M 200 140 Q 150 180 120 200" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5,4" fill="none" opacity="0.85" />

    <!-- Power Sockets (Schneider 16A) & Switches -->
    <g fill="#10b981" stroke="#10b981" stroke-width="1.5">
      <!-- Socket at wall -->
      <path d="M 0 100 A 8 8 0 0 1 0 116 Z" fill="none" stroke="#10b981" />
      <!-- Switch symbol -->
      <circle cx="120" cy="110" r="4" fill="#10b981" />
      <line x1="120" y1="110" x2="132" y2="102" stroke="#10b981" />
      <line x1="132" y1="102" x2="136" y2="106" stroke="#10b981" />
    </g>

    <!-- Distribution Panel Box (SDP Fort Metal IP55) -->
    <rect x="-6" y="55" width="12" height="24" fill="#ef4444" stroke="#f87171" stroke-width="1.5" />
    <text x="18" y="70" fill="#f87171" font-family="'Geist Mono', monospace" font-size="10" stroke="none" font-weight="700">PANEL SDP</text>
  </g>

  <!-- Right Side: Engineering Calculations & SLD Card Preview -->
  <g transform="translate(390, 85)">
    <!-- SLD & BOQ Blueprint Card -->
    <rect x="0" y="10" width="360" height="255" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.8" />
    
    <!-- Card Header -->
    <rect x="0" y="10" width="360" height="42" rx="12" fill="#1e293b" />
    <text x="18" y="36" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">TECHNICAL SPECIFICATIONS &amp; BOQ</text>
    <rect x="270" y="21" width="75" height="20" rx="4" fill="#10b981" opacity="0.2" />
    <text x="307" y="35" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">PUIL 2011</text>

    <!-- SLD Micro Diagram -->
    <g transform="translate(20, 70)" stroke="#38bdf8" stroke-width="1.4" fill="none">
      <!-- PLN Source & kWh Meter -->
      <circle cx="20" cy="20" r="14" stroke="#f59e0b" fill="#1e293b" />
      <text x="20" y="24" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" stroke="none">PLN</text>
      <line x1="34" y1="20" x2="70" y2="20" stroke="#f59e0b" stroke-width="2" />
      
      <!-- Main MCB 3-Phase 25A -->
      <rect x="70" y="8" width="45" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" />
      <text x="92" y="24" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" stroke="none">3Ø 25A</text>
      
      <!-- Busbar -->
      <line x1="115" y1="20" x2="140" y2="20" stroke="#38bdf8" stroke-width="2" />
      <line x1="140" y1="-5" x2="140" y2="65" stroke="#ef4444" stroke-width="3" />
      
      <!-- Feeder Branches (Floors 1, 2, 3) -->
      <!-- Branch 1 (Floor 1) -->
      <line x1="140" y1="5" x2="185" y2="5" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="185" y="-5" width="40" height="20" rx="3" fill="#1e293b" stroke="#10b981" />
      <text x="205" y="9" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" stroke="none">MCB 10A</text>
      <text x="235" y="9" fill="#94a3b8" font-family="sans-serif" font-size="9" stroke="none">Lantai 1</text>

      <!-- Branch 2 (Floor 2) -->
      <line x1="140" y1="30" x2="185" y2="30" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="185" y="20" width="40" height="20" rx="3" fill="#1e293b" stroke="#10b981" />
      <text x="205" y="34" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" stroke="none">MCB 10A</text>
      <text x="235" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" stroke="none">Lantai 2</text>

      <!-- Branch 3 (Floor 3 & Rooftop) -->
      <line x1="140" y1="55" x2="185" y2="55" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="185" y="45" width="40" height="20" rx="3" fill="#1e293b" stroke="#10b981" />
      <text x="205" y="59" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" stroke="none">MCB 6A</text>
      <text x="235" y="59" fill="#94a3b8" font-family="sans-serif" font-size="9" stroke="none">Lantai 3 / Roof</text>
    </g>

    <!-- Key Metrics Table / Specs -->
    <g transform="translate(18, 160)">
      <line x1="0" y1="0" x2="320" y2="0" stroke="#334155" stroke-width="1" />
      <text x="5" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Titik Lampu:</text>
      <text x="140" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">50 Titik Downlight</text>
      
      <text x="5" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">Stop Kontak 16A:</text>
      <text x="140" y="46" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">20 Titik (Schneider)</text>

      <text x="5" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11">Perhitungan Lumen:</text>
      <text x="140" y="68" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Metode Kp / Ku SNI</text>

      <text x="5" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">Estimasi Anggaran:</text>
      <text x="140" y="90" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Lengkap di Excel RAB</text>
    </g>
  </g>

  <!-- Bottom Dimension Lines / Title Footer -->
  <g transform="translate(60, 395)" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="0" x2="690" y2="0" stroke="#334155" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    <circle cx="690" cy="0" r="3" fill="#38bdf8" />
    <text x="0" y="28" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="12" stroke="none">DRAWING CODE: DWG-INST-RUMAH-3L</text>
    <text x="440" y="28" fill="#38bdf8" font-family="'Geist Mono', monospace" font-size="12" stroke="none">FORMAT: A3 FULL BLEED • SKALA 1:100</text>
  </g>
</svg>
