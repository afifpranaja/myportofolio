<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gedungBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>
    <pattern id="gedungGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f3a60" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#gedungBg)" />
  <rect width="800" height="500" fill="url(#gedungGrid)" />

  <!-- Badge Header -->
  <rect x="40" y="32" width="340" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" />
  <circle cx="56" cy="47" r="4" fill="#10b981" />
  <text x="70" y="52" fill="#10b981" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">PROYEK INSTALASI LISTRIK II • POLINEMA</text>

  <!-- Schematic Layout of Building Power Distribution -->
  <g transform="translate(60, 95)">
    <!-- Facility Building Boundary Outline -->
    <rect x="0" y="20" width="310" height="240" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Building Sections / Zones -->
    <rect x="15" y="35" width="130" height="95" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="80" y="75" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">ZONE A: PRODUKSI</text>
    <text x="80" y="95" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Panel LDP 1</text>

    <rect x="165" y="35" width="130" height="95" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="230" y="75" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">ZONE B: WORKSHOP</text>
    <text x="230" y="95" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Panel LDP 2</text>

    <rect x="15" y="145" width="280" height="100" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="155" y="185" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">ZONE C: MAIN ELECTRICAL ROOM (MDP &amp; GENSET)</text>
    <text x="155" y="205" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11">Trafo Distribusi 20kV / 400V • ATS/AMF</text>

    <!-- Cable Tray Highway Interconnects -->
    <path d="M 80 145 L 80 130" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <path d="M 230 145 L 230 130" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <circle cx="80" cy="130" r="3" fill="#f59e0b" />
    <circle cx="230" cy="130" r="3" fill="#f59e0b" />
  </g>

  <!-- Right Technical Spec Card -->
  <g transform="translate(410, 85)">
    <rect x="0" y="10" width="345" height="255" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
    
    <rect x="0" y="10" width="345" height="42" rx="12" fill="#1e293b" />
    <text x="18" y="36" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">ELECTRICAL DRAWING SYSTEM (DWG)</text>
    <rect x="260" y="21" width="70" height="20" rx="4" fill="#38bdf8" opacity="0.2" />
    <text x="295" y="35" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">AUTOCAD</text>

    <!-- Engineering Content Details -->
    <g transform="translate(18, 72)">
      <text x="0" y="15" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Lingkup Perancangan Sistem:</text>
      
      <circle cx="5" cy="38" r="3" fill="#10b981" />
      <text x="15" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11">Denah tata letak beban tenaga &amp; penerangan gedung</text>

      <circle cx="5" cy="62" r="3" fill="#10b981" />
      <text x="15" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11">Rute kabel trunking, conduit pipa &amp; kabel tray</text>

      <circle cx="5" cy="86" r="3" fill="#10b981" />
      <text x="15" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="11">Perhitungan KHA, jatuh tegangan (drop voltage)</text>

      <circle cx="5" cy="110" r="3" fill="#10b981" />
      <text x="15" y="114" fill="#cbd5e1" font-family="sans-serif" font-size="11">Koordinasi proteksi pemutus daya (MCCB &amp; MCB)</text>

      <circle cx="5" cy="134" r="3" fill="#10b981" />
      <text x="15" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">Standar gambar teknik ISO A4/A3 Full Bleed</text>

      <line x1="0" y1="155" x2="310" y2="155" stroke="#334155" stroke-width="1" />
      <text x="0" y="176" fill="#94a3b8" font-family="sans-serif" font-size="11">Kategori Dokumen:</text>
      <text x="120" y="176" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">AutoCAD DWG to PDF</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 395)" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="0" x2="690" y2="0" stroke="#334155" />
    <circle cx="0" cy="0" r="3" fill="#10b981" />
    <circle cx="690" cy="0" r="3" fill="#10b981" />
    <text x="0" y="28" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="12" stroke="none">PROJECT: PROYEK INSTALASI LISTRIK II (SEMESTER 5)</text>
    <text x="440" y="28" fill="#10b981" font-family="'Geist Mono', monospace" font-size="12" stroke="none">POLITEKNIK NEGERI MALANG</text>
  </g>
</svg>
