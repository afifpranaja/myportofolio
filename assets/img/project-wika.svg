<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wikaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
    <linearGradient id="wikaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#wikaBg)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="45" width="280" height="32" rx="16" fill="rgba(249, 115, 22, 0.12)" stroke="rgba(249, 115, 22, 0.3)" />
  <text x="75" y="66" fill="#fb923c" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">PT WIJAYA KARYA BETON TBK.</text>

  <!-- Crane / Equipment Box -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="2" />
    <!-- Crane Hook Icon -->
    <path d="M 90 40 L 90 90 M 70 90 L 110 90 M 70 90 Q 60 140 90 140 Q 110 140 110 115" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />
    <circle cx="90" cy="40" r="10" fill="#334155" />
    <text x="90" y="180" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">HOIST CRANE</text>
    <text x="90" y="202" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Production Machinery</text>
    <text x="90" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Plant Equipment</text>
  </g>

  <!-- Flow Line 1 (Modbus RS-485) -->
  <path d="M 260 280 L 330 280" stroke="#f97316" stroke-width="3" stroke-dasharray="6,4" />
  <text x="295" y="268" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="10">RS-485</text>
  <circle cx="295" cy="280" r="4" fill="#f97316" />

  <!-- Power Meter & Gateway Box -->
  <g transform="translate(330, 160)">
    <rect x="0" y="0" width="160" height="240" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="15" y="20" width="130" height="85" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="80" y="42" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">GAE EMG 20B</text>
    <text x="25" y="65" fill="#f8fafc" font-family="monospace" font-size="11">388.2 V</text>
    <text x="25" y="82" fill="#f8fafc" font-family="monospace" font-size="11">42.50 A</text>
    <text x="25" y="99" fill="#10b981" font-family="monospace" font-size="11">COS: 0.94</text>

    <!-- HF2211 Serial Server -->
    <rect x="15" y="125" width="130" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="148" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">HF2211 SERVER</text>
    <text x="80" y="170" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">TCP/IP Gateway</text>

    <text x="80" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Instrumentation</text>
  </g>

  <!-- Flow Line 2 (Ethernet/WiFi) -->
  <path d="M 490 280 L 560 280" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  <text x="525" y="268" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">TCP/IP</text>
  <circle cx="525" cy="280" r="4" fill="#38bdf8" />

  <!-- Industrial Web Monitoring Screen -->
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="180" height="30" rx="12" fill="#1e293b" />
    <circle cx="15" cy="15" r="4" fill="#ef4444" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" />
    <circle cx="41" cy="15" r="4" fill="#10b981" />
    
    <text x="90" y="60" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="14" font-weight="700">OPERATIONAL</text>
    
    <!-- Mini graph -->
    <path d="M 20 120 L 50 100 L 80 115 L 110 85 L 140 95 L 160 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    
    <text x="25" y="155" fill="#e2e8f0" font-family="monospace" font-size="11">R-Phase : 224 V</text>
    <text x="25" y="175" fill="#e2e8f0" font-family="monospace" font-size="11">S-Phase : 225 V</text>
    <text x="25" y="195" fill="#e2e8f0" font-family="monospace" font-size="11">T-Phase : 223 V</text>
    <text x="25" y="215" fill="#34d399" font-family="monospace" font-size="11">PLC: Connected</text>

    <text x="90" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Live Web Scada</text>
  </g>

  <!-- Bottom Accent / Specs -->
  <text x="400" y="530" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    Equipment Division Intern • Pasuruan Precast Concrete Plant • 2025
  </text>
  <text x="400" y="555" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">
    Modbus RTU • Master-K120s PLC • Industrial Power Telemetry
  </text>
</svg>
